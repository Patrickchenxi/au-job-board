services:
  panel:
    build: .
    image: au-job-board:local
    init: true
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - configuration:/app/config
      - data:/app/data
      - reports:/app/out
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  configuration:
  data:
  reports:
